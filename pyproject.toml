# =============================================================================
# PJ Assistant Agent — Configuração do Projeto
# =============================================================================
#
# Este arquivo é o "package.json" do Python moderno (PEP 621).
# Substitui setup.py, setup.cfg, requirements.txt em um único arquivo.
#
# Comandos úteis:
#   pip install -e "."       → instala o projeto em modo editável
#   pip install -e ".[dev]"  → instala com dependências de desenvolvimento
#   pytest                   → roda testes
#   ruff check .             → lint
#   mypy src                 → type checking
#
# =============================================================================

[project]
name = "pj-assistant-agent"
version = "0.1.0"
description = "Agente de IA Generativa para clientes PJ - Case Itaú"
requires-python = ">=3.11"

# ── Dependências de Produção ────────────────────────────────────────
# Organizadas por responsabilidade para facilitar manutenção.
dependencies = [
    # --- LLM & Agent ---
    # langchain: framework base para LLM (chains, prompts, tools)
    # langgraph: grafo de execução do agente (nodes + edges)
    # langchain-openai: integração com API da OpenAI (GPT-4o-mini)
    # langchain-community: integrações comunitárias (ChromaDB, etc.)
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",

    # --- API ---
    # fastapi: framework web async (substitui Flask/Django para APIs)
    # uvicorn: servidor ASGI de produção (worker HTTP)
    # httpx: cliente HTTP async (para chamadas ao BFA se necessário)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",

    # --- RAG ---
    # chromadb: vector store local (persistência em disco)
    # Embeddings via OpenAI API (text-embedding-3-small) — não precisa de
    # sentence-transformers/torch, economizando ~800MB na imagem Docker.
    "chromadb>=0.5.0",

    # --- Observability ---
    # langfuse: plataforma de monitoramento de LLM (prompts, custos)
    # prometheus-client: métricas expostas em /metrics (scraping)
    # opentelemetry-*: tracing distribuído (spans, trace_id)
    # structlog: logging estruturado em JSON (machine-readable)
    # axiom-py: cliente oficial Axiom (logs centralizados, 500GB/mês free)
    "langfuse>=2.0.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "structlog>=24.0.0",
    "axiom-py>=1.0.0",

    # --- Config & Utils ---
    # pydantic: validação de dados + serialização (modelos de domínio)
    # pydantic-settings: config via .env (Settings class)
    # tiktoken: tokenizer da OpenAI (contagem de tokens)
    # tenacity: retry com backoff exponencial (resiliência LLM)
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "tiktoken>=0.7.0",
    "tenacity>=9.0.0",
]

# ── Dependências de Desenvolvimento ────────────────────────────────
# Instalar com: pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    # pytest: framework de testes (fixtures, markers, parametrize)
    # pytest-asyncio: suporte a testes assíncronos (async def test_*)
    # pytest-cov: relatório de cobertura de código
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",

    # httpx: usado nos testes de integração (ASGITransport)
    "httpx>=0.27.0",

    # ruff: linter + formatter ultra-rápido (substitui flake8+black+isort)
    # mypy: type checker estático (valida type hints)
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

# =============================================================================
# Ruff — Linter + Formatter
# =============================================================================
# Ruff é ~100x mais rápido que flake8 (escrito em Rust).
# Substitui: flake8, black, isort, pyupgrade, bugbear.
[tool.ruff]
target-version = "py311"    # Compatibilidade com Python 3.11
line-length = 100           # Limite de 100 chars (mais generoso que PEP8=79)

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (PEP8)
    "F",    # pyflakes (imports não usados, variáveis indefinidas)
    "I",    # isort (ordenação de imports)
    "N",    # pep8-naming (convenções de nome)
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade (moderniza syntax para Python 3.11+)
    "B",    # flake8-bugbear (bugs comuns)
    "SIM",  # flake8-simplify (simplificações de código)
]

# =============================================================================
# Pytest — Configuração de Testes
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]       # Pasta raiz dos testes
asyncio_mode = "auto"       # Testes async rodam sem @pytest.mark.asyncio manual

# Markers personalizados — permitem rodar subsets:
#   pytest -m unit          → só unitários
#   pytest -m integration   → só integração
#   pytest -m agent         → só testes do agente
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "agent: Agent workflow tests",
]

# =============================================================================
# MyPy — Type Checking
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true               # Modo estrito — exige type hints em todo lugar
